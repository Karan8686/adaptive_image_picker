name: adaptive_image_picker
description: "A production-grade, zero-permission adaptive image picker for Flutter with pure-Dart cropping, binary-search compression, and native PhotoPicker integration."
version: 1.0.2
homepage: https://github.com/Karan8686/adaptive_image_picker
repository: https://github.com/Karan8686/adaptive_image_picker
issue_tracker: https://github.com/Karan8686/adaptive_image_picker/issues
topics:
  - image-picker
  - image-cropper
  - image-compression
  - camera
  - photopicker

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  file_selector: ^1.0.3
  image: ^4.9.2
  http: ^1.2.0
  path: ^1.9.0
  path_provider: ^2.1.2
  plugin_platform_interface: ^2.1.8
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.yourdomain.adaptive_image_picker
        pluginClass: AdaptiveImagePickerPlugin
      ios:
        pluginClass: AdaptiveImagePickerPlugin
      web:
        pluginClass: AdaptiveImagePickerWeb
        fileName: adaptive_image_picker_web.dart
      windows:
        dartPluginClass: AdaptiveImagePickerDesktop
        fileName: adaptive_image_picker_desktop.dart
      macos:
        dartPluginClass: AdaptiveImagePickerDesktop
        fileName: adaptive_image_picker_desktop.dart
      linux:
        dartPluginClass: AdaptiveImagePickerDesktop
        fileName: adaptive_image_picker_desktop.dart


